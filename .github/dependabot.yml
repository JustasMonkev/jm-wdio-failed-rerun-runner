version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      wdio:
        patterns: ['@wdio/*']
      dev-tooling:
        patterns: ['eslint', '@eslint/*', 'typescript-eslint', 'typescript', 'vitest', '@vitest/*', '@types/*', 'jiti']
  - package-ecosystem: npm
    directory: /example
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
